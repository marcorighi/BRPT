name: smoke-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m py_compile brpt.py brpt_test.py

      - name: Run BRPT smoke tests
        run: python -m unittest discover -s tests -v

      - name: Verify command help
        run: |
          python brpt.py --help >/dev/null
          python brpt_test.py --help >/dev/null
